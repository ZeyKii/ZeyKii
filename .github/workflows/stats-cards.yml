name: Cartes de statistiques

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    paths: [.github/workflows/stats-cards.yml]

permissions:
  contents: read

concurrency:
  group: stats-cards-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: stats-organization/github-readme-stats-action@2c498845f71017821efaad14293ebc736156ef21
        with:
          card: stats
          options: "username=ZeyKii&show_icons=true&include_all_commits=true&rank_icon=github&hide_border=true&bg_color=0d1117&title_color=C4B5FD&icon_color=C4B5FD&text_color=c9d1d9"
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          core_version: "2.2.0"
          fail_on_error: "true"

      - uses: stats-organization/github-readme-stats-action@2c498845f71017821efaad14293ebc736156ef21
        with:
          card: top-langs
          options: "username=ZeyKii&layout=compact&langs_count=8&hide_border=true&bg_color=0d1117&title_color=C4B5FD&text_color=c9d1d9"
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          core_version: "2.2.0"
          fail_on_error: "true"

      - if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: cartes
          path: profile/*.svg
          retention-days: 3

      - if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/stats.svg profile/top-langs.svg
          git diff --cached --quiet && exit 0
          git commit -m "Cartes de statistiques mises a jour"
          git push
